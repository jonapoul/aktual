name: Report Build Results
description: Publish build report annotations

runs:
  using: composite
  steps:
    - name: Report build results
      uses: gmazzo/publish-report-annotations@919085297c42529c75cc7f7795b8325b795de061 # v1.23.0
      if: ${{ !cancelled() }}
      with:
        filterPassedTests: true
        invalidFileAction: report
