main:
  minSDK: 28
  targetSDK: 37
  permissions:
  - android.permission.ACCESS_COARSE_LOCATION
  - android.permission.ACCESS_FINE_LOCATION
  - android.permission.ACCESS_NETWORK_STATE
  - android.permission.INTERNET
  - android.permission.USE_BIOMETRIC
  - android.permission.USE_FINGERPRINT
  features:
  - android.hardware.location:
      required: false
  - android.hardware.location.gps:
      required: false
  libraries:
  - androidx.window.extensions:
      required: false
  - androidx.window.sidecar:
      required: false
  nativeLibraries:
  - libandroidx.graphics.path:
      requiredBy: androidx.graphics:graphics-path
      abis:
      - arm64-v8a
      - armeabi-v7a
      - x86
      - x86_64
  - libdatastore_shared_counter:
      requiredBy: androidx.datastore:datastore-core-android
      abis:
      - arm64-v8a
      - armeabi-v7a
      - x86
      - x86_64
  - libsqliteJni:
      requiredBy: androidx.sqlite:sqlite-bundled-android
      abis:
      - arm64-v8a
      - armeabi-v7a
      - x86
      - x86_64
  exports:
    activity:
    - aktual.app.android.AktualActivity
    activity-alias:
    - aktual.app.android.LauncherAurora
    - aktual.app.android.LauncherDark
    - aktual.app.android.LauncherDefault
    - aktual.app.android.LauncherInk
    - aktual.app.android.LauncherLight
    - aktual.app.android.LauncherSunset
    - aktual.app.android.LauncherViolet
    receiver:
    - androidx.profileinstaller.ProfileInstallReceiver
variants:
  debug:
    namespace: dev.jonpoulton.aktual.app.dev
    permissions:
    - android.permission.POST_NOTIFICATIONS
    - android.permission.READ_EXTERNAL_STORAGE
    - android.permission.WRITE_EXTERNAL_STORAGE
    - dev.jonpoulton.aktual.app.dev.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
    exports:
      activity:
      - leakcanary.internal.activity.LeakActivity
      activity-alias:
      - leakcanary.internal.activity.LeakLauncherActivity
  release:
    namespace: dev.jonpoulton.aktual.app
    permissions:
    - dev.jonpoulton.aktual.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
fingerprint: e77603dda10c39139c19a4c29c8dfa62
