name: Main

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '!**/*.md'
      - '!.claude/**'
      - '!.github/CODEOWNERS'
      - '!.github/renovate.json5'
      - '!.github/upstream-*/**'
      - '!.github/workflows/check-upstream-changes.yml'
      - '!.github/workflows/nightly.yml'
      - '!.github/workflows/pr.yml'
      - '!config/betterleaks.toml'

permissions:
  contents: write
  checks: write

concurrency:
  group: 'ci-${{ github.event.merge_group.head_ref || github.head_ref }}-${{ github.workflow }}'
  cancel-in-progress: true

env:
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
  S3_BUILD_CACHE_BUCKET: ${{ secrets.S3_BUILD_CACHE_BUCKET }}
  S3_BUILD_CACHE_ENDPOINT: ${{ secrets.S3_BUILD_CACHE_ENDPOINT }}
  S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      test-results-url: ${{ steps.test-results.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref }}
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-gradle-properties
      - run: ./gradlew testAll koverXmlReport koverVerify -Pkover
      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}
      # The XML keeps suppressed exceptions, e.g. the cause of UncaughtExceptionsBeforeTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: test-results
        if: ${{ failure() }}
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

      - shell: bash
        run: |
          REPORT=build/reports/kover/report.xml
          COVERAGE=$(tail -6 "$REPORT" \
            | grep 'type="LINE"' \
            | sed -E 's/.*missed="([0-9]+)".*covered="([0-9]+)".*/\1 \2/' \
            | awk '{printf "%.1f", $2 * 100 / ($1 + $2)}')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 6bf1b7a292bc61bcca966bee22e8b456
          filename: coverage-badge.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 0
          maxColorRange: 100

      - uses: ./.github/actions/report-build-results
        if: ${{ !cancelled() }}

  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-gradle-properties
      - run: ./gradlew atlasGenerate
      - name: Collect module graphs
        run: |
          find . -path '*/build/atlas/chart.*' \( -name '*.png' -o -name '*.svg' \) | while read -r chart; do
            dest="$RUNNER_TEMP/site/${chart%/build/atlas/*}"
            mkdir -p "$dest"
            cp "$chart" "$dest/"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy

  flag-failure:
    needs: [ main, charts ]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TEST_RESULTS_URL: ${{ needs.main.outputs.test-results-url }}
        run: |
          TITLE="Main build is failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          BODY="Failed on $SHA: $RUN_URL"
          if [ -n "$TEST_RESULTS_URL" ]; then
            BODY="$BODY"$'\n\n'"Test results: $TEST_RESULTS_URL"
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --body "$BODY"
          fi
