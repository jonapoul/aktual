<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas charts</title>
  <style>
    :root {
      --bg: #00000a;
      --panel: #0d0d1a;
      --border: #24243a;
      --text: #dcdce6;
      --muted: #8a8aa3;
      --link: #8ab4f8;
      --bar: #3b5bdb;
      --row-hover: #16162a;
      --row-selected: #1f2a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 ui-monospace, "JetBrains Mono", Menlo, monospace;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      padding: 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 18px; }
    .stats { color: var(--muted); }
    .stats b { color: var(--text); font-weight: normal; }
    input {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
      padding: 6px 10px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
    }
    main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 16px; }
    .list { flex: none; overflow-y: auto; }
    table { border-collapse: collapse; }
    th {
      position: sticky;
      top: 0;
      background: var(--bg);
      text-align: left;
      color: var(--muted);
      font-weight: normal;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th[data-dir="asc"]::after { content: " \25B2"; }
    th[data-dir="desc"]::after { content: " \25BC"; }
    td { padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tr.group td { color: var(--muted); padding-top: 14px; border-bottom: none; }
    tbody tr:not(.group):hover { background: var(--row-hover); }
    tbody tr { scroll-margin-top: 40px; }
    tbody tr.selected { background: var(--row-selected); }
    tr.none td { padding: 24px 8px; color: var(--muted); text-align: center; border-bottom: none; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .size { display: flex; align-items: center; gap: 8px; }
    .size span { min-width: 64px; }
    .bar { height: 6px; background: var(--bar); border-radius: 3px; }
    .barbox { width: 60px; display: flex; justify-content: flex-start; }
    .muted { color: var(--muted); }
    aside {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    aside img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    aside .empty { margin: auto; color: var(--muted); }
    @media (max-width: 900px) {
      aside { display: none; }
      .list { flex: 1; }
    }
  </style>
</head>
<body>
<header>
  <h1>Atlas charts</h1>
  <span class="stats" id="stats"></span>
  <input id="filter" type="search" placeholder="Filter modules (/)" autofocus>
</header>
<main>
  <div class="list" id="list">
    <table>
      <thead>
        <tr>
          <th data-key="path">Module</th>
          <th data-key="size">Size</th>
          <th data-key="modified">Modified</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <aside>
    <div id="preview-title" class="muted">Hover a module to preview its chart</div>
    <img id="preview-img" alt="" hidden>
  </aside>
</main>
<script>
  const generated = __GENERATED__;
  const charts = __CHARTS__;

  const list = document.getElementById("list");
  const rows = document.getElementById("rows");
  const filter = document.getElementById("filter");
  const stats = document.getElementById("stats");
  const previewTitle = document.getElementById("preview-title");
  const previewImg = document.getElementById("preview-img");
  const maxSize = Math.max(1, ...charts.map(c => c.size));
  let sortKey = "path";
  let sortDir = "asc";
  let items = [];
  let selected = null;

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }

  function formatAge(millis) {
    const seconds = Math.round((generated - millis) / 1000);
    if (seconds < 60) return "just now";
    if (seconds < 3600) return Math.round(seconds / 60) + "m ago";
    if (seconds < 86400) return Math.round(seconds / 3600) + "h ago";
    return Math.round(seconds / 86400) + "d ago";
  }

  function el(tag, props, children) {
    const node = Object.assign(document.createElement(tag), props || {});
    (children || []).forEach(c => node.append(c));
    return node;
  }

  function preview(chart) {
    previewTitle.textContent = chart.path + " · " + formatSize(chart.size);
    previewTitle.className = "";
    previewImg.src = chart.url;
    previewImg.hidden = false;
  }

  function select(index, scroll) {
    items.forEach((item, i) => item.row.classList.toggle("selected", i === index));
    const item = items[index];
    if (!item) return;
    selected = item.chart;
    preview(item.chart);
    if (scroll) item.row.scrollIntoView({ block: "nearest" });
  }

  function move(delta) {
    if (!items.length) return;
    const current = items.findIndex(i => i.chart === selected);
    const next = current < 0 ? 0 : Math.min(items.length - 1, Math.max(0, current + delta));
    select(next, true);
  }

  function render() {
    const query = filter.value.trim().toLowerCase();
    const visible = charts
      .filter(c => c.path.toLowerCase().includes(query))
      .sort((a, b) => {
        const x = a[sortKey], y = b[sortKey];
        const order = x < y ? -1 : x > y ? 1 : 0;
        return sortDir === "asc" ? order : -order;
      });

    rows.replaceChildren();
    items = [];
    let lastGroup = null;
    visible.forEach(chart => {
      if (sortKey === "path" && chart.group !== lastGroup) {
        lastGroup = chart.group;
        rows.append(el("tr", { className: "group" }, [el("td", { colSpan: 3, textContent: chart.group })]));
      }
      const width = Math.max(2, Math.round(chart.size / maxSize * 60));
      const row = el("tr", {}, [
        el("td", {}, [el("a", { href: chart.url, target: "_blank", textContent: chart.path })]),
        el("td", {}, [
          el("div", { className: "size" }, [
            el("span", { textContent: formatSize(chart.size) }),
            el("div", { className: "barbox" }, [el("div", { className: "bar", style: "width:" + width + "px" })]),
          ]),
        ]),
        el("td", { className: "muted", title: new Date(chart.modified).toLocaleString() }, [formatAge(chart.modified)]),
      ]);
      const index = items.length;
      items.push({ chart, row });
      row.addEventListener("mouseenter", () => select(index, false));
      rows.append(row);
    });
    if (!visible.length) {
      const columns = document.querySelectorAll("th").length;
      rows.append(el("tr", { className: "none" }, [el("td", { colSpan: columns, textContent: "No matching modules" })]));
    }
    select(items.findIndex(i => i.chart === selected), false);

    const total = visible.reduce((sum, c) => sum + c.size, 0);
    stats.innerHTML = "<b>" + visible.length + "</b> of " + charts.length + " charts · <b>"
      + formatSize(total) + "</b> · generated " + new Date(generated).toLocaleString();
  }

  document.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      sortDir = sortKey === key && sortDir === "asc" ? "desc" : "asc";
      sortKey = key;
      document.querySelectorAll("th").forEach(h => h.removeAttribute("data-dir"));
      th.dataset.dir = sortDir;
      render();
    });
  });
  document.querySelector('th[data-key="path"]').dataset.dir = "asc";

  filter.addEventListener("input", render);
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== filter) {
      e.preventDefault();
      filter.focus();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      move(e.key === "ArrowDown" ? 1 : -1);
    }
  });

  render();
  list.style.minWidth = list.offsetWidth + "px";
</script>
</body>
</html>
