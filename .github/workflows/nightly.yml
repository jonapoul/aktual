name: Nightly

on:
  # 22:23 UTC: GitHub delays scheduled runs up to ~7.5h, so this should finish before 06:00 UTC
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'nightly'
  cancel-in-progress: false

env:
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
  S3_BUILD_CACHE_ACCESS_KEY_ID: ${{ secrets.S3_BUILD_CACHE_ACCESS_KEY_ID }}
  S3_BUILD_CACHE_BUCKET: ${{ secrets.S3_BUILD_CACHE_BUCKET }}
  S3_BUILD_CACHE_ENDPOINT: ${{ secrets.S3_BUILD_CACHE_ENDPOINT }}
  S3_BUILD_CACHE_SECRET_KEY: ${{ secrets.S3_BUILD_CACHE_SECRET_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      # Skip scheduled runs when the last successful nightly already built this commit. Cancel
      # rather than succeed, so nightly.link keeps serving the last run that has artifacts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          LAST=$(gh run list --workflow nightly.yml --branch main --status success --limit 1 \
            --json headSha --jq '.[0].headSha' 2> /dev/null || true)
          if [ "$EVENT" != "schedule" ] || [ "$LAST" != "$SHA" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            gh run cancel "$RUN_ID"
          fi

  android:
    needs: check
    if: ${{ needs.check.outputs.should-build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-gradle-properties
      - uses: ./.github/actions/setup-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: ./gradlew :aktual-app:android:assembleRelease
      - run: |
          mkdir out
          cp aktual-app/android/build/outputs/apk/release/*.apk out/
          cp aktual-app/android/build/outputs/mapping/release/mapping.txt out/aktual-android-mapping.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*
          if-no-files-found: error
      - id: version
        run: |
          APK=$(basename out/*.apk)
          VERSION=${APK#aktual.}
          echo "version=${VERSION%.release.apk}" >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 6bf1b7a292bc61bcca966bee22e8b456
          filename: nightly-android-badge.json
          label: nightly apk
          message: ${{ steps.version.outputs.version }}
          color: orange

  desktop:
    needs: check
    if: ${{ needs.check.outputs.should-build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: packageReleaseDeb
          - os: macos-latest
            tasks: packageReleaseDmg
          - os: windows-latest
            tasks: packageReleaseMsi packageReleaseExe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-gradle-properties
      # ProGuard doesn't support the config cache, which can't be disabled with isolated projects on
      - env:
          TASKS: ${{ matrix.tasks }}
        run: |
          ./gradlew $(printf ':aktual-app:desktop:%s ' $TASKS) \
            --no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false
      # jpackage only writes its errors to these files
      - if: ${{ failure() }}
        run: tail -n +1 aktual-app/desktop/build/compose/logs/*/*.txt || true
      # Flatten the per-format folders so the release gets files rather than directories
      - run: |
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          mkdir out
          cp aktual-app/desktop/build/compose/binaries/main-release/*/aktual-desktop-* out/
          cp aktual-app/desktop/build/outputs/mapping.txt "out/aktual-desktop-$OS-mapping.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  # A rolling pre-release, so the app's nightly update check can download the APK without a GitHub
  # login. Waits for every build, so it matches the last successful run the app compares against
  release:
    needs: [ android, desktop ]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" --name android --dir out
          cp out/*.apk aktual-nightly.apk
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly aktual-nightly.apk --prerelease --latest=false \
            --target "$SHA" --title "Nightly" \
            --notes "Android nightly build of $SHA. Replaced by every nightly run."

  flag-failure:
    needs: [ check, android, desktop, release ]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          TITLE="Nightly build is failing"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          BODY="Failed on $SHA: $RUN_URL"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --body "$BODY"
          fi
