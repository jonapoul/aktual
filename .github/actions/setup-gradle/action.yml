name: Setup Gradle
description: Set up Gradle with caching and encryption

runs:
  using: composite
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        add-job-summary: on-failure
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
