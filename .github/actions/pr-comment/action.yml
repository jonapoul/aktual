name: PR Comment
description: Update this job's section of the shared PR status comment

inputs:
  comment-id:
    description: ID of the comment, from pr_comment.py create
    required: true
  section:
    description: Section key, also used for ordering in pr_comment.py
    required: true
  title:
    description: Heading for the failure section
    default: ''
  status:
    description: The job status. On failure the section lists failures from build reports
    default: ''
  body:
    description: Markdown for the section, used instead of the generated one. Empty with a passing status removes the section
    default: ''

runs:
  using: composite
  steps:
    - name: Write section
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha }}
        TITLE: ${{ inputs.title }}
        STATUS: ${{ inputs.status }}
        BODY: ${{ inputs.body }}
      run: |
        rm -rf "$RUNNER_TEMP/pr-comment"
        python3 "$GITHUB_ACTION_PATH/pr_comment.py" section "$RUNNER_TEMP/pr-comment-section/${{ inputs.section }}.md"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        name: pr-comment-${{ inputs.section }}
        path: ${{ runner.temp }}/pr-comment-section/${{ inputs.section }}.md
        retention-days: 1
        overwrite: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ !cancelled() }}
      continue-on-error: true
      with:
        pattern: pr-comment-*
        merge-multiple: true
        path: ${{ runner.temp }}/pr-comment
    - name: Update comment
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ inputs.comment-id }}
      run: python3 "$GITHUB_ACTION_PATH/pr_comment.py" render "$RUNNER_TEMP/pr-comment"
