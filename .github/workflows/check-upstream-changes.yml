name: Check Upstream Changes

on:
  # Every 6 hours. GitHub delays scheduled runs by hours, so a daily run could leave an upstream
  # migration unreported for over a day
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - run: chmod +x .github/upstream-migration-tracker/check-migrations.sh

      - run: .github/upstream-migration-tracker/check-migrations.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  check-theme-attributes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - run: chmod +x .github/upstream-theme-tracker/check-theme-attributes.sh

      - run: .github/upstream-theme-tracker/check-theme-attributes.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
